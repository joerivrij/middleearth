apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: isengard-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/eck-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: isengard
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: isengard-stack
  namespace: flux-system
spec:
  dependsOn:
    - name: isengard-operator
  interval: 10m
  path: ./stacks/overlays/wormtongue
  prune: true
  sourceRef:
    kind: GitRepository
    name: isengard
  timeout: 15m
  wait: true

