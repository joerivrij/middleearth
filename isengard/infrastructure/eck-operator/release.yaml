apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eck-operator
spec:
  chart:
    spec:
      chart: eck-operator
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: elastic
      version: "3.2.x"
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

