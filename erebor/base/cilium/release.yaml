apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 10m
  chart:
    spec:
      chart: cilium
      version: 1.18.6
      sourceRef:
        kind: HelmRepository
        name: cilium
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    ipam:
      mode: kubernetes
    kubeProxyReplacement: false
    enableHostFirewall: false
    # Erebor uses a custom Apple container-machine kernel with Cilium's
    # netfilter requirements built in.
    l7Proxy: true
    envoy:
      enabled: true
    operator:
      replicas: 1
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
