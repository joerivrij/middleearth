all:
  children:
    container_machines:
      hosts:
        erebor:
          # Replaced at runtime with the address returned by machine inspect.
          ansible_host: erebor.test
          ansible_user: "{{ lookup('env', 'USER') }}"
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_private_key_file: "~/.ssh/id_apple_machine"
