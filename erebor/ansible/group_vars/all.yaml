machine_name: erebor
machine_image: local/erebor-machine:latest
machine_cpus: 4
machine_memory: 8G
machine_recreate: false
kernel_rebuild: false
machine_kernel: "{{ erebor_dir }}/kernel/Image"
apple_machine_ssh_private_key: "{{ lookup('env', 'HOME') }}/.ssh/id_apple_machine"
apple_machine_ssh_public_key: "{{ apple_machine_ssh_private_key }}.pub"
k0s_version: v1.35.2+k0s.0
cilium_version: 1.18.6

# Keep paths canonical: Apple's container builder rejects contexts containing
# a literal `..`, even when they resolve inside the repository.
erebor_dir: "{{ playbook_dir | dirname }}"
kubeconfig_path: "{{ erebor_dir }}/machine/kubeconfig"
