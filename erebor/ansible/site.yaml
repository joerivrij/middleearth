---
- name: Create the Apple container machine
  hosts: localhost
  gather_facts: false
  vars:
    machine_dir: "{{ playbook_dir | dirname }}/machine"
    staged_public_key: "{{ machine_dir }}/ssh/id_apple_machine.pub"
  tasks:
    - name: Check required local commands
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - "command -v {{ item }}"
      changed_when: false
      loop:
        - cilium
        - container
        - kubectl

    - name: Check for the Apple machine private key
      ansible.builtin.stat:
        path: "{{ apple_machine_ssh_private_key }}"
      register: apple_private_key

    - name: Check for the Apple machine public key
      ansible.builtin.stat:
        path: "{{ apple_machine_ssh_public_key }}"
      register: apple_public_key

    - name: Require the Apple machine SSH keypair
      ansible.builtin.assert:
        that:
          - apple_private_key.stat.exists
          - apple_public_key.stat.exists
        fail_msg: >-
          Create ~/.ssh/id_apple_machine first; see the Erebor README for the
          one-time ssh-keygen command.

    - name: Create the ignored SSH build-context directory
      ansible.builtin.file:
        path: "{{ staged_public_key | dirname }}"
        state: directory
        mode: "0700"

    - name: Stage only the Apple machine public key for the image build
      ansible.builtin.copy:
        src: "{{ apple_machine_ssh_public_key }}"
        dest: "{{ staged_public_key }}"
        mode: "0644"

    - name: Start the Apple container service
      ansible.builtin.command:
        argv: [container, system, start]
      changed_when: false

    - name: Check for the custom Erebor kernel
      ansible.builtin.stat:
        path: "{{ machine_kernel }}"
      register: custom_kernel

    - name: Build the Cilium-capable Erebor kernel
      ansible.builtin.command:
        argv: ["{{ playbook_dir | dirname }}/kernel/build.sh"]
      when: not custom_kernel.stat.exists
      changed_when: true

    - name: Build the Debian machine image
      ansible.builtin.command:
        argv:
          - container
          - build
          - --tag
          - "{{ machine_image }}"
          - --file
          - "{{ machine_dir }}/Containerfile"
          - "{{ machine_dir }}"
      changed_when: true

    - name: Inspect the Erebor machine
      ansible.builtin.command:
        argv: [container, machine, inspect, "{{ machine_name }}"]
      register: machine_inspect
      changed_when: false
      failed_when: false

    - name: Remove Erebor when recreation is explicitly requested
      ansible.builtin.command:
        argv: [container, machine, rm, "{{ machine_name }}"]
      when:
        - machine_recreate | bool
        - machine_inspect.rc == 0
      register: machine_removed
      changed_when: true

    - name: Create the Erebor machine
      ansible.builtin.command:
        argv:
          - container
          - machine
          - create
          - "{{ machine_image }}"
          - --name
          - "{{ machine_name }}"
          - --cpus
          - "{{ machine_cpus | string }}"
          - --memory
          - "{{ machine_memory }}"
          - --kernel
          - "{{ machine_kernel }}"
      when: machine_inspect.rc != 0 or machine_removed is changed
      changed_when: true

    - name: Inspect the running Erebor machine
      ansible.builtin.command:
        argv: [container, machine, inspect, "{{ machine_name }}"]
      register: running_machine
      changed_when: false

    - name: Register Erebor with its current machine address
      ansible.builtin.add_host:
        name: "{{ machine_name }}"
        groups: container_machines
        ansible_host: "{{ (running_machine.stdout | from_json | first).ipAddress }}"
        ansible_user: "{{ lookup('env', 'USER') }}"
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: "{{ apple_machine_ssh_private_key }}"

    - name: Wait for SSH on the machine
      ansible.builtin.wait_for:
        host: "{{ (running_machine.stdout | from_json | first).ipAddress }}"
        port: 22
        timeout: 180

- name: Provision k0s over SSH
  hosts: container_machines
  gather_facts: true
  become: true
  tasks:
    - name: Download the k0s installer
      ansible.builtin.get_url:
        url: https://get.k0s.sh
        dest: /tmp/install-k0s.sh
        mode: "0755"

    - name: Check whether k0s is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k0s
      register: k0s_binary

    - name: Install the pinned k0s version
      ansible.builtin.command:
        argv: [/tmp/install-k0s.sh]
      environment:
        K0S_VERSION: "{{ k0s_version }}"
      when: not k0s_binary.stat.exists
      changed_when: true

    - name: Create the k0s configuration directory
      ansible.builtin.file:
        path: /etc/k0s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the k0s cluster configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname }}/machine/k0s.yaml"
        dest: /etc/k0s/k0s.yaml
        owner: root
        group: root
        mode: "0644"
      register: k0s_config

    - name: Check whether the k0s service exists
      ansible.builtin.stat:
        path: /etc/systemd/system/k0scontroller.service
      register: k0s_service

    - name: Install the k0s controller and worker service
      ansible.builtin.command:
        argv:
          - k0s
          - install
          - controller
          - --enable-worker
          - --no-taints
          - --config
          - /etc/k0s/k0s.yaml
      when: not k0s_service.stat.exists
      notify: Restart k0s
      changed_when: true

    - name: Enable and start k0s
      ansible.builtin.systemd_service:
        name: k0scontroller
        enabled: true
        state: started

    - name: Restart k0s after a configuration change
      ansible.builtin.systemd_service:
        name: k0scontroller
        state: restarted
      when: k0s_config.changed and k0s_service.stat.exists

    - name: Wait for the Kubernetes API inside Erebor
      ansible.builtin.command:
        argv: [k0s, kubectl, get, --raw=/readyz]
      register: api_ready
      changed_when: false
      retries: 60
      delay: 2
      until: api_ready.rc == 0

    - name: Generate the administrator kubeconfig
      ansible.builtin.command:
        argv: [k0s, kubeconfig, admin]
      register: admin_kubeconfig
      changed_when: false
      no_log: true

    - name: Normalize the Erebor kubeconfig names
      ansible.builtin.set_fact:
        normalized_kubeconfig:
          apiVersion: v1
          kind: Config
          clusters:
            - name: erebor
              cluster: >-
                {{ (admin_kubeconfig.stdout | from_yaml).clusters[0].cluster
                   | combine({'server': 'https://' ~ ansible_host ~ ':6443'}) }}
          users:
            - name: erebor-admin
              user: "{{ (admin_kubeconfig.stdout | from_yaml).users[0].user }}"
          contexts:
            - name: erebor
              context:
                cluster: erebor
                namespace: kube-system
                user: erebor-admin
          current-context: erebor
      no_log: true

    - name: Store the kubeconfig on macOS
      ansible.builtin.copy:
        content: "{{ normalized_kubeconfig | to_nice_yaml(indent=2, sort_keys=false) }}"
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

  handlers:
    - name: Restart k0s
      ansible.builtin.systemd_service:
        name: k0scontroller
        state: restarted

- name: Seed Cilium from macOS
  hosts: localhost
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  tasks:
    - name: Wait for the externally reachable Kubernetes API
      ansible.builtin.command:
        argv: [kubectl, get, --raw=/readyz]
      register: external_api_ready
      changed_when: false
      retries: 60
      delay: 2
      until: external_api_ready.rc == 0

    - name: Check whether the Cilium namespace exists
      ansible.builtin.command:
        argv: [kubectl, get, namespace, cilium]
      register: cilium_namespace
      changed_when: false
      failed_when: false

    - name: Create the Cilium namespace
      ansible.builtin.command:
        argv: [kubectl, create, namespace, cilium]
      when: cilium_namespace.rc != 0
      changed_when: true

    - name: Check whether Cilium is already installed
      ansible.builtin.command:
        argv: [kubectl, get, daemonset, cilium, --namespace, cilium]
      register: cilium_daemonset
      changed_when: false
      failed_when: false

    - name: Seed or reconcile the Cilium release needed by Flux
      ansible.builtin.command:
        argv:
          - cilium
          - "{{ 'upgrade' if cilium_daemonset.rc == 0 else 'install' }}"
          - --version
          - "{{ cilium_version }}"
          - --namespace
          - cilium
          - --set
          - ipam.mode=kubernetes
          - --set
          - kubeProxyReplacement=false
          - --set
          - enableHostFirewall=false
          - --set
          - l7Proxy=true
          - --set
          - envoy.enabled=true
          - --set
          - operator.replicas=1
          - --set
          - hubble.relay.enabled=true
          - --set
          - hubble.ui.enabled=true
          - --wait
          - --wait-duration
          - 10m
      changed_when: true

    - name: Wait for Cilium to become ready
      ansible.builtin.command:
        argv:
          - cilium
          - status
          - --namespace
          - cilium
          - --wait
          - --wait-duration
          - 10m
      changed_when: false

    - name: Print the next step
      ansible.builtin.debug:
        msg: >-
          Erebor is ready. Export KUBECONFIG={{ kubeconfig_path }} and run
          {{ erebor_dir }}/bootstrap-flux.sh.
