apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: erebor-rook-ceph-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 10m
  path: ./khazad-dum/apps/erebor/base/rook-ceph-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: erebor
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: erebor-rook-ceph
  namespace: flux-system
spec:
  dependsOn:
    - name: erebor-rook-ceph-operator
    - name: traefik
  interval: 10m
  path: ./khazad-dum/apps/erebor/overlays/bilbo/rook-ceph
  prune: true
  sourceRef:
    kind: GitRepository
    name: erebor
  timeout: 30m
  wait: true

