apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rook-ceph
resources:
  - ns.yaml
  - repository.yaml
  - operator-release.yaml
  - cluster-release.yaml
configMapGenerator:
  - name: rook-ceph-operator-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
