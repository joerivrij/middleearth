apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 10m
  dependsOn:
    - name: traefik-crds
  chart:
    spec:
      chart: traefik
      version: 34.2.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    crds: Skip
    remediation:
      retries: -1
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    deployment:
      kind: Deployment
    updateStrategy:
      type: Recreate
    ports:
      web:
        port: 8082
      websecure:
        port: 8443
        tls:
          enabled: false
      nats:
        port: 4222
      controllergrpc:
        port: 32055
      sbdb:
        port: 6642
      sbdb0:
        port: 16642
      sbdb1:
        port: 26642
      sbdb2:
        port: 36642
      traefik:
        port: 9000
        expose:
          default: false
          internal: true
    service:
      enabled: true
      type: ClusterIP
    podSecurityContext:
      fsGroup: 65532
