apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 4h
  retryInterval: 2m
  timeout: 10m
  path: ./erebor/gitops/infra/base/cert-manager
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: erebor
