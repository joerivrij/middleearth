apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik-crds
  interval: 4h
  retryInterval: 2m
  timeout: 30m
  path: ./erebor/gitops/infra/overlays/bilbo/rook-ceph
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: erebor
