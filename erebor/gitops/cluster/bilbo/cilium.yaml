apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik-crds
  interval: 4h
  retryInterval: 2m
  timeout: 10m
  path: ./erebor/gitops/infra/overlays/bilbo/cilium
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: erebor
