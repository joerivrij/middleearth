[package]
name = "celebrimbor"
version = "0.1.0"
edition = "2024"

[features]
default = []
libvirt = ["dep:virt"]

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }
virt = { version = "0.4.3", optional = true }
