apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  chart:
    spec:
      chart: metrics-server
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: metrics-server
      version: "3.13.x"
  install:
    remediation:
      retries: -1
  interval: 10m
  upgrade:
    remediation:
      retries: 3
