apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-crds
spec:
  chart:
    spec:
      chart: traefik-crds
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: traefik
      version: "1.2.x"
  install:
    remediation:
      retries: -1
  interval: 10m
  upgrade:
    remediation:
      retries: 3
