apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  chart:
    spec:
      chart: traefik
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: traefik
      version: "40.x"
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
    service:
      type: LoadBalancer
