apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  chart:
    spec:
      chart: traefik
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: traefik
      version: "34.2.x"
  install:
    crds: Skip
    remediation:
      retries: -1
  interval: 10m
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
    api:
      dashboard: true
    service:
      type: NodePort
    ports:
      web:
        nodePort: 30080
      websecure:
        nodePort: 30443
