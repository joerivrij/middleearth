apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: morannon
  namespace: flux-system
spec:
  interval: 10m
  ref:
    branch: main
  url: https://github.com/OWNER/morannon.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: morannon
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-networking
  interval: 10m
  path: ./clusters/default
  prune: true
  sourceRef:
    kind: GitRepository
    name: morannon
  timeout: 15m
  wait: true

