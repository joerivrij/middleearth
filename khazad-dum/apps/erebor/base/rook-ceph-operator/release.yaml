apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 10m
  chart:
    spec:
      chart: rook-ceph
      version: v1.19.5
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: rook-ceph-operator-values
      valuesKey: values.yaml
