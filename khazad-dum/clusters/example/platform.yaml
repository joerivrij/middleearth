apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-networking
  namespace: flux-system
spec:
  interval: 10m
  path: ./khazad-dum/infrastructure/base/cilium
  prune: true
  sourceRef:
    kind: GitRepository
    name: khazad-dum
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-certificates
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-networking
  interval: 10m
  path: ./khazad-dum/infrastructure/base/cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: khazad-dum
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-ingress
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-networking
  interval: 10m
  path: ./khazad-dum/infrastructure/base/traefik
  prune: true
  sourceRef:
    kind: GitRepository
    name: khazad-dum
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-metrics
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-networking
  interval: 10m
  path: ./khazad-dum/infrastructure/base/metrics-server
  prune: true
  sourceRef:
    kind: GitRepository
    name: khazad-dum
  timeout: 10m
  wait: true
