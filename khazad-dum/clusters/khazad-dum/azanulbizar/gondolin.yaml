apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gondolin
  namespace: flux-system
spec:
  interval: 10m
  ref:
    branch: main
  url: https://github.com/joerivrij/middleearth.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gondolin
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 10m
  path: ./gondolin/cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: gondolin
  timeout: 10m
  wait: true
