apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: isengard
  namespace: flux-system
spec:
  interval: 10m
  ref:
    branch: feat/add-experiments
  url: https://github.com/joerivrij/middleearth.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: isengard
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 10m
  path: ./isengard/cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: isengard
  timeout: 20m
  wait: true
