apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: kyverno
      version: "3.8.x"
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

