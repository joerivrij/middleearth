---
# Start locally. To serve the LAN/tailnet, add Bree's stable addresses here
# and the corresponding client CIDRs below. Ensure UDP and TCP port 53 are
# reachable only by those clients; tailnet access also depends on tailnet ACLs.
unbound_interfaces:
  - 127.0.0.1
unbound_allowed_networks:
  - 127.0.0.0/8
unbound_forwarders: []
unbound_local_records: []
