---
all:
  children:
    machine_hosts:
      hosts:
        smaug:
          ansible_connection: local
          machine_backend: lima
          machine_name: smaug
          machine_lima_additional_disks:
            - name: smaug-osd-0
              size: 20GiB
            - name: smaug-osd-1
              size: 20GiB
          machine_guest_vars:
            # Verify disk names with lsblk before deploying on different hardware.
            ceph_osd_devices: [/dev/vdb, /dev/vdc]
