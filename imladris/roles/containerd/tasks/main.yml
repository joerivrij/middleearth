---
- name: Install and configure standalone containerd
  when: containerd_install
  block:
    - name: Install containerd
      ansible.builtin.package:
        name: "{{ containerd_package_name }}"
        state: present

    - name: Ensure the containerd configuration directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: containerd_configure

    - name: Configure containerd
      ansible.builtin.template:
        src: config.toml.j2
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: "0644"
      when: containerd_configure
      notify: Restart containerd

    - name: Enable containerd
      ansible.builtin.service:
        name: containerd
        enabled: true
        state: started

