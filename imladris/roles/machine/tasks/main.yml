---
- name: Validate machine inputs
  ansible.builtin.assert:
    that:
      - machine_backend in ["baremetal", "lima", "container"]
      - machine_backend_filter in ["all", "baremetal", "lima", "container"]
      - machine_state in ["present", "absent"]
      - machine_name | length > 0
      - machine_backend == "baremetal" or ansible_facts.system == "Darwin"
      - machine_backend == "baremetal" or ansible_facts.architecture in machine_architecture_map
    fail_msg: "Choose baremetal, lima, or container. Local VM backends require macOS."

# add_host bypasses the host loop, so machine provisioning plays use serial: 1.
- name: Manage the selected machine backend
  ansible.builtin.include_tasks: "{{ machine_backend }}.yml"
  when: machine_backend_filter in ["all", machine_backend]
