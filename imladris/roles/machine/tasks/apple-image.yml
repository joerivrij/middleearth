---
- name: Check Apple machine host-side commands
  ansible.builtin.command:
    argv: [sh, -c, "command -v {{ item }}"]
  loop:
    - container
  changed_when: false

- name: Check for the Apple machine kernel
  ansible.builtin.stat:
    path: "{{ machine_container_kernel }}"
  register: imladris_kernel

- name: Check for matching Apple machine kernel modules
  ansible.builtin.stat:
    path: "{{ apple_machine_dir }}/machine/modules"
  register: imladris_kernel_modules

- name: Build the Cilium-capable Apple machine kernel
  ansible.builtin.command:
    argv: ["{{ apple_machine_dir }}/kernel/build.sh"]
  when: >-
    not imladris_kernel.stat.exists or
    not imladris_kernel_modules.stat.exists or
    kernel_rebuild | bool
  register: imladris_kernel_build
  changed_when: true

- name: Create the ignored Apple machine SSH build directory
  ansible.builtin.file:
    path: "{{ apple_machine_dir }}/machine/ssh"
    state: directory
    mode: "0700"

- name: Stage only the Apple machine public key
  ansible.builtin.copy:
    src: "{{ machine_container_ssh_public_key }}"
    dest: "{{ apple_machine_dir }}/machine/ssh/id_apple_machine.pub"
    mode: "0644"
  register: imladris_staged_key

- name: Rebuild the machine image when its inputs changed
  ansible.builtin.set_fact:
    machine_container_rebuild_image: >-
      {{ machine_container_rebuild_image | bool or
         imladris_kernel_build is changed or imladris_staged_key is changed }}
