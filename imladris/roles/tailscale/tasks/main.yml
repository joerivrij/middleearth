---
- name: Require a supported Tailscale APT distribution
  ansible.builtin.assert:
    that:
      - tailscale_repository_distribution in ['debian', 'raspbian', 'ubuntu']
    fail_msg: Set tailscale_repository_distribution for this Debian derivative.

- name: Install repository prerequisites
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the Tailscale signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_repository_distribution }}/{{ tailscale_repository_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: '0644'

- name: Configure the Tailscale repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ tailscale_repository_distribution }} {{ tailscale_repository_release }} main
    owner: root
    group: root
    mode: '0644'
  register: tailscale_repository

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if tailscale_repository.changed else 3600 }}"

- name: Enable the Tailscale daemon
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
