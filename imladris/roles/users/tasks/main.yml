---
- name: Create managed users
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default(omit) }}"
    append: true
    shell: "{{ item.shell | default(users_default_shell) }}"
    create_home: true
    state: present
  loop: "{{ imladris_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install managed SSH public keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
  loop: "{{ imladris_users | subelements('authorized_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}"

- name: Remove explicitly retired users
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: false
  loop: "{{ users_remove }}"

